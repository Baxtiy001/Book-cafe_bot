<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Book Cafe</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ============================================================
   Theme tokens — overridden at runtime by admin branding config
   ============================================================ */
:root {
  --primary: #B4552D;
  --accent: #2D6A4F;
  --bg: #FAF6F0;
  --card: #FFFFFF;
  --text: #2B2118;
  --muted: #8A7B6C;
  --border: #EAE2D8;
  --radius: 16px;
  --font: -apple-system, 'Segoe UI', Roboto, sans-serif;
  --danger: #C0392B;
  --success: #2D6A4F;
  --shadow: 0 2px 10px rgba(43, 33, 24, .07);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  padding-bottom: 92px;
  overscroll-behavior-y: contain;
}
button { font-family: var(--font); cursor: pointer; }
input, select, textarea {
  font-family: var(--font); font-size: 15px; color: var(--text);
  background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; padding: 11px 12px; width: 100%; outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--primary); }
.hidden { display: none !important; }

/* ------------------------------ header ------------------------------ */
.header {
  position: sticky; top: 0; z-index: 40;
  background: var(--card); border-bottom: 1px solid var(--border);
  padding: 10px 14px; display: flex; align-items: center; gap: 10px;
}
.header .logo { width: 38px; height: 38px; border-radius: 10px; object-fit: cover; }
.header .logo-fallback {
  width: 38px; height: 38px; border-radius: 10px; background: var(--primary);
  color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px;
}
.header .titles { flex: 1; min-width: 0; }
.header h1 { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.header .sub { font-size: 11px; color: var(--muted); }
.header select {
  width: auto; max-width: 130px; padding: 6px 8px; font-size: 13px; border-radius: 8px;
}
.role-chip {
  font-size: 10px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase;
  padding: 4px 8px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 14%, transparent);
  color: var(--accent);
}
.banner { width: 100%; height: 110px; object-fit: cover; display: block; }

/* ------------------------------ tabs ------------------------------ */
.tabs {
  display: flex; gap: 4px; padding: 8px 10px 0; overflow-x: auto;
  position: sticky; top: 58px; z-index: 39; background: var(--bg);
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  border: none; background: transparent; color: var(--muted);
  font-size: 13px; font-weight: 600; padding: 8px 12px; border-radius: 10px;
  white-space: nowrap; transition: all .15s;
}
.tab.active { background: var(--primary); color: #fff; }

/* ------------------------------ cards & grids ------------------------------ */
main { padding: 12px 14px; max-width: 720px; margin: 0 auto; }
.card {
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 14px; margin-bottom: 12px;
}
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.dish-card {
  background: var(--card); border-radius: var(--radius); overflow: hidden;
  box-shadow: var(--shadow); display: flex; flex-direction: column; transition: transform .12s;
}
.dish-card:active { transform: scale(.98); }
.dish-card .img { width: 100%; aspect-ratio: 4/3; object-fit: cover; background: var(--border); }
.dish-card .img.ph { display: flex; align-items: center; justify-content: center; font-size: 30px; }
.dish-card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.dish-card h4 { font-size: 14px; line-height: 1.25; }
.dish-card .desc { font-size: 11.5px; color: var(--muted); flex: 1;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.price-row { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
.price { font-weight: 800; font-size: 14px; }
.price .old { text-decoration: line-through; color: var(--muted); font-weight: 400; font-size: 11px; margin-left: 5px; }
.badge { font-size: 9px; font-weight: 800; padding: 3px 6px; border-radius: 6px; letter-spacing: .3px; }
.badge.hit { background: #FDECEC; color: var(--danger); }
.badge.vegan { background: #E7F6EC; color: var(--success); }
.badge.out { background: #EEE; color: #888; }
.add-btn {
  border: none; background: var(--primary); color: #fff; font-weight: 700;
  font-size: 12px; padding: 7px 12px; border-radius: 9px; transition: opacity .15s;
}
.add-btn:disabled { opacity: .45; }
.qty { display: flex; align-items: center; gap: 8px; }
.qty button {
  width: 26px; height: 26px; border-radius: 50%; border: none; font-size: 15px; font-weight: 800;
  background: color-mix(in srgb, var(--primary) 12%, transparent); color: var(--primary);
}
.qty span { font-weight: 800; min-width: 16px; text-align: center; }

/* category chips */
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  border: 1px solid var(--border); background: var(--card); color: var(--text);
  font-size: 12.5px; font-weight: 600; padding: 7px 12px; border-radius: 999px; white-space: nowrap;
}
.chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }

/* ------------------------------ cart bar ------------------------------ */
.cart-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
  background: var(--card); border-top: 1px solid var(--border);
}
.cart-inner { max-width: 692px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.cart-total { font-size: 12px; color: var(--muted); }
.cart-total b { display: block; font-size: 15px; color: var(--text); }
.btn {
  border: none; border-radius: 12px; font-weight: 700; font-size: 14px;
  padding: 13px 18px; transition: opacity .15s, transform .1s;
}
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .5; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-accent { background: var(--accent); color: #fff; }
.btn-ghost { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-block { width: 100%; }
.btn-sm { padding: 8px 12px; font-size: 12.5px; border-radius: 9px; }

/* ------------------------------ lists / rows ------------------------------ */
.row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.row:last-child { border-bottom: none; }
.row .grow { flex: 1; min-width: 0; }
.row .title { font-size: 14px; font-weight: 600; }
.row .sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
.thumb { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; background: var(--border); }
.thumb.ph { display: flex; align-items: center; justify-content: center; font-size: 18px; }

.status-chip { font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 999px; }
.st-new { background: #FFF4E0; color: #B4762D; }
.st-accepted, .st-cooking { background: #E7F0FD; color: #2D6FD1; }
.st-ready { background: #E7F6EC; color: var(--success); }
.st-courier_assigned, .st-delivering { background: #F0E9FD; color: #7C3AED; }
.st-delivered { background: #E7F6EC; color: var(--success); }
.st-cancelled { background: #FDECEC; color: var(--danger); }

.kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi { background: var(--card); border-radius: 12px; padding: 10px; text-align: center; box-shadow: var(--shadow); }
.kpi b { display: block; font-size: 15px; }
.kpi span { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }

.bar-chart { display: flex; align-items: flex-end; gap: 4px; height: 90px; padding-top: 6px; }
.bar-chart .bar { flex: 1; background: color-mix(in srgb, var(--primary) 70%, transparent);
  border-radius: 4px 4px 0 0; min-height: 3px; position: relative; }
.bar-chart .bar span { position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%);
  font-size: 8px; color: var(--muted); }

.empty { text-align: center; color: var(--muted); padding: 40px 10px; font-size: 14px; }
.empty .big { font-size: 38px; margin-bottom: 8px; }

.section-title { font-size: 15px; font-weight: 800; margin: 4px 0 10px; }
.form-grid { display: grid; gap: 8px; }
.form-grid.two { grid-template-columns: 1fr 1fr; }
label.f { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; display: block; margin-bottom: 3px; }
.check-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.check-row input { width: auto; }
.actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

.toggle { position: relative; width: 44px; height: 24px; background: var(--border); border-radius: 999px; transition: background .15s; border: none; }
.toggle.on { background: var(--success); }
.toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .15s; }
.toggle.on::after { left: 22px; }

#toast {
  position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%) translateY(20px);
  background: var(--text); color: var(--bg); font-size: 13px; font-weight: 600;
  padding: 10px 16px; border-radius: 999px; opacity: 0; transition: all .25s; z-index: 99;
  pointer-events: none; max-width: 86%; text-align: center;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.sheet-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 60;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.sheet-backdrop.show { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 61;
  background: var(--bg); border-radius: 20px 20px 0 0; padding: 16px 14px calc(18px + env(safe-area-inset-bottom));
  transform: translateY(100%); transition: transform .25s; max-height: 88vh; overflow-y: auto;
}
.sheet.show { transform: translateY(0); }
.sheet h3 { font-size: 16px; margin-bottom: 12px; }
.grabber { width: 40px; height: 4px; background: var(--border); border-radius: 99px; margin: 0 auto 12px; }

.upell-card { display: flex; gap: 10px; align-items: center; padding: 8px 0; }
.spin {
  width: 26px; height: 26px; border: 3px solid var(--border); border-top-color: var(--primary);
  border-radius: 50%; animation: spin .8s linear infinite; margin: 30px auto;
}
@keyframes spin { to { transform: rotate(360deg); } }
.muted { color: var(--muted); font-size: 12px; }
.mono { font-family: ui-monospace, monospace; font-size: 12px; }
code.pin { background: var(--border); padding: 2px 7px; border-radius: 6px; font-weight: 800; }
</style>
</head>
<body>

<header class="header">
  <img id="brandLogo" class="logo hidden" alt="">
  <div id="brandLogoFallback" class="logo-fallback hidden">📚</div>
  <div class="titles">
    <h1 id="brandName">Book Cafe</h1>
    <div class="sub" id="branchName">Yuklanmoqda…</div>
  </div>
  <select id="branchSelect" class="hidden"></select>
  <span id="roleChip" class="role-chip hidden"></span>
</header>
<img id="brandBanner" class="banner hidden" alt="">

<nav class="tabs" id="tabs"></nav>
<main id="view"></main>

<div class="cart-bar" id="cartBar">
  <div class="cart-inner">
    <div class="cart-total">
      <span id="cartCount">0 ta mahsulot</span>
      <b id="cartSum">0 so'm</b>
    </div>
    <button class="btn btn-primary" style="flex:1" id="cartBtn">🛒 Savat</button>
  </div>
</div>

<div id="toast"></div>
<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="sheet"></div>

<script src="app.js"></script>
</body>
</html>
